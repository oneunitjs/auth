name: auth

# Tag pushes are not filtered by paths. A release tag auth-v<version>
# triggers verification, consumer smoke tests, and publishing.

on:
  push:
    branches: [main]
    tags: ["auth-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack check
        run: npm run pack:check

      - name: Audit
        run: npm audit --audit-level=high

  publish-dry-run:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build and pack
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the tarball into a clean project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install "$RUNNER_TEMP"/oneunit-auth-*.tgz

      - name: Verify the public API
        run: |
          cat > "$RUNNER_TEMP/consumer/smoke.mjs" <<'EOF'
          import assert from "node:assert/strict";
          import {
            createAuth,
            matchPermission,
            isValidExpiresIn,
            UnauthorizedError,
          } from "@oneunit/auth";

          const auth = createAuth({
            secret: "x".repeat(32),
            rbac: { roles: { user: { permissions: ["a.read"] } } },
          });

          const session = await auth.login({ id: 1, roles: ["user"] });
          assert.deepEqual(session.payload.permissions, ["a.read"]);
          assert.equal((await auth.verify(session.accessToken)).sub, "1");

          await assert.rejects(
            () => auth.verify(session.refreshToken),
            UnauthorizedError
          );

          await auth.refresh(session.refreshToken);
          await assert.rejects(
            () => auth.refresh(session.refreshToken),
            UnauthorizedError
          );

          assert.equal(matchPermission("a.**", "a.b.c"), true);
          assert.equal(isValidExpiresIn("15m"), true);
          assert.equal(isValidExpiresIn("1y"), false);

          console.log("public API OK");
          EOF

          cd "$RUNNER_TEMP/consumer"
          node smoke.mjs

  # Publishing is driven by a tag, never by a push to main.
  # Release: git tag auth-v<version> && git push origin auth-v<version>
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify, publish-dry-run]
    if: startsWith(github.ref, 'refs/tags/auth-v')

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      - name: Tag must match the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#auth-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          echo "tag: $TAG_VERSION, package.json: $PKG_VERSION"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public --provenance

      - name: Confirm it is live
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#auth-v}"
          PUBLISHED="$(npm view @oneunit/auth version)"

          echo "published: $PUBLISHED"

          if [ "$PUBLISHED" != "$TAG_VERSION" ]; then
            echo "::error::registry reports $PUBLISHED, expected $TAG_VERSION"
            exit 1
          fi
