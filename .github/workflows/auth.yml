```yaml
name: auth

# Tag pushes are not filtered by paths. A release tag auth-v<version>
# triggers verification, consumer smoke tests, and publishing.

on:
  push:
    branches: [main]
    paths:
      - "packages/auth/**"
      - ".github/workflows/auth.yml"
  pull_request:
    paths:
      - "packages/auth/**"
      - ".github/workflows/auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    defaults:
      run:
        working-directory: packages/auth

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Pack check
        run: pnpm run pack:check

      - name: Audit
        run: pnpm audit --audit-level high

  publish-dry-run:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and pack
        run: |
          pnpm --filter @oneunit/auth run build
          pnpm --filter @oneunit/auth pack --pack-destination "$RUNNER_TEMP"

      - name: Install the tarball into a clean project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install "$RUNNER_TEMP"/oneunit-auth-*.tgz

      - name: Verify the public API
        run: |
          cat > "$RUNNER_TEMP/consumer/smoke.mjs" <<'EOF'
          import assert from "node:assert/strict";
          import {
            createAuth,
            matchPermission,
            isValidExpiresIn,
            UnauthorizedError,
          } from "@oneunit/auth";

          const auth = createAuth({
            secret: "x".repeat(32),
            rbac: { roles: { user: { permissions: ["a.read"] } } },
          });

          const session = await auth.login({ id: 1, roles: ["user"] });
          assert.deepEqual(session.payload.permissions, ["a.read"]);
          assert.equal((await auth.verify(session.accessToken)).sub, "1");

          await assert.rejects(
            () => auth.verify(session.refreshToken),
            UnauthorizedError
          );

          await auth.refresh(session.refreshToken);
          await assert.rejects(
            () => auth.refresh(session.refreshToken),
            UnauthorizedError
          );

          assert.equal(matchPermission("a.**", "a.b.c"), true);
          assert.equal(isValidExpiresIn("15m"), true);
          assert.equal(isValidExpiresIn("1y"), false);

          console.log("public API OK");
          EOF

          cd "$RUNNER_TEMP/consumer"
          node smoke.mjs

      - name: Verify shipped examples resolve
        working-directory: ${{ runner.temp }}/consumer
        run: |
          for example in standalone express fastify uwebsockets oauth-social sessions; do
            npx --yes tsx "node_modules/@oneunit/auth/examples/$example.ts"
          done

  # Publishing is driven by a tag, never by a push to main.
  # Release: git tag auth-v2.0.0 && git push origin auth-v2.0.0
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify, publish-dry-run]
    if: startsWith(github.ref, 'refs/tags/auth-v')

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: packages/auth

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile

      - name: Tag must match the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#auth-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          echo "tag: $TAG_VERSION, package.json: $PKG_VERSION"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish
        run: pnpm publish --access public --no-git-checks

      - name: Confirm it is live
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#auth-v}"
          PUBLISHED="$(npm view @oneunit/auth version)"

          echo "published: $PUBLISHED"

          if [ "$PUBLISHED" != "$TAG_VERSION" ]; then
            echo "::error::registry reports $PUBLISHED, expected $TAG_VERSION"
            exit 1
          fi
```
